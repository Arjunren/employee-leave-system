services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leave
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [leave_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/leave
      DATABASE_USERNAME: leave
      DATABASE_PASSWORD: leave
      ALLOWED_ORIGINS: http://localhost:3000
      SPRING_PROFILES_ACTIVE: dev
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  leave_data: {}

