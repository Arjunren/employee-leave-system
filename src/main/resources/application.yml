spring:
  application:
    name: employee-leave-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leave}
    username: ${DATABASE_USERNAME:leave}
    password: ${DATABASE_PASSWORD:leave}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  security:
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:30}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

